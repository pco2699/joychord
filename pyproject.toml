[project]
name = "joychord"
version = "0.1.0"
description = "Musical Chord Controller - Convert Bluetooth game controllers into MIDI chord controllers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "JoyChord Contributors"}
]
keywords = ["midi", "music", "controller", "gamepad", "chords", "nashville-number-system"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "pygame>=2.0.0",
    "mido>=1.2.0",
    "python-rtmidi>=1.4.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/pco2699/joychord"
Repository = "https://github.com/pco2699/joychord"
Issues = "https://github.com/pco2699/joychord/issues"

[project.scripts]
joychord = "joychord:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]
